# ── CISO Toolbox — Full Stack Docker Compose ─────────────────
# All modules + Traefik reverse proxy
#
# Usage:
#   cp .env.example .env    # Edit with your settings
#   docker compose up -d    # Start all services
#
# URLs (with default DOMAIN=localhost):
#   https://localhost/           → Pilot (dashboard)
#   https://localhost/risk/      → Risk (EBIOS RM)
#   https://localhost/vendor/    → Vendor (TPRM)
#   https://localhost/compliance/→ Compliance
#
# Or with a real domain (DOMAIN=ciso.example.com):
#   https://ciso.example.com/
#   https://ciso.example.com/risk/
#   etc.

# ─────────────────────────────────────────────────────────────
# Shared env block — injected via YAML anchor into every module.
# Keeps the 8 backend services in sync without hand-maintained copies.
# ─────────────────────────────────────────────────────────────
x-module-env: &module-env
  JWT_SECRET: ${JWT_SECRET}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
  AUTH_MODE: ${AUTH_MODE:-pilot}
  PILOT_URL: http://pilot-app:8080
  ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
  ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-common}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_LABEL: ${OIDC_LABEL:-SSO}

# Shared healthcheck block for app containers
x-app-healthcheck: &app-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
  interval: 30s
  timeout: 10s
  retries: 3

# Shared healthcheck block for postgres containers — the CMD-SHELL uses the
# POSTGRES_USER of each db, so it stays per-service.

services:

  # ════════════════════════════════════════════════════════════
  # REVERSE PROXY — Nginx
  # ════════════════════════════════════════════════════════════

  proxy:
    image: nginx:alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: ciso-proxy
    restart: unless-stopped
    # Hardening (CNT-02) — same posture as the app containers. The master
    # process still starts as root (official image) but with only the four
    # capabilities nginx actually needs:
    #   NET_BIND_SERVICE  bind :80/:443 inside the container
    #   SETUID/SETGID     master drops privileges to the `nginx` worker user
    #   CHOWN             master chowns the proxy temp dirs to the worker user
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    tmpfs:
      # /tmp receives the rewritten nginx.conf from the startup command below.
      - /tmp:noexec,nosuid,size=16m
      # proxy/client body buffering temp dirs (compiled-in defaults).
      - /var/cache/nginx:noexec,nosuid,size=64m
      # nginx.pid — /var/run is a symlink to /run in alpine.
      - /run:noexec,nosuid,size=16m
    # nginx.conf `include`s /tmp/resolver.conf, generated here from the
    # container's own /etc/resolv.conf: under Docker the DNS is 127.0.0.11,
    # under Podman it sits at the network gateway (e.g. 10.89.0.1). Without
    # it, every upstream is "could not be resolved" and the whole suite 502s.
    #
    # ONLY the resolver line is generated. nginx then runs on the MOUNTED
    # /etc/nginx/nginx.conf, so `nginx -s reload` picks up an edit. The
    # earlier version copied the whole config to /tmp and ran nginx on that
    # copy — a reload replayed the stale snapshot and edits looked ignored.
    command:
      - /bin/sh
      - -c
      - |
        DNS=$$(awk '/^nameserver/{print $$2; exit}' /etc/resolv.conf)
        echo "ciso-proxy: nginx resolver -> $$DNS"
        echo "resolver $$DNS valid=10s ipv6=off;" > /tmp/resolver.conf
        exec nginx -g 'daemon off;'
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      pilot-app:
        condition: service_healthy
      risk-app:
        condition: service_healthy
      vendor-app:
        condition: service_healthy
      compliance-app:
        condition: service_healthy
      asset-app:
        condition: service_healthy
      audit-app:
        condition: service_healthy
      access-app:
        condition: service_healthy
      surface-app:
        condition: service_healthy
    networks:
      - ciso-net

  # ════════════════════════════════════════════════════════════
  # PILOT — Governance Dashboard
  # ════════════════════════════════════════════════════════════

  # CNT-01 — the app images below are pinned by content digest
  # (`:latest@sha256:…`): the tag stays readable, the digest is what Docker
  # actually resolves, so a repointed `:latest` can't silently change what runs.
  # Refresh the digests at release with `bash tools/pin-images.sh` (adopts each
  # tag's current bytes after review); `tools/pin-images.sh --check` fails CI on
  # any image left on a bare tag.
  # Locally this is inert: docker-compose.override.yml rebuilds them as
  # `ciso-*:local` with `pull_policy: never`, so nothing is pulled from ghcr.io.
  # NOTE: `ciso-postgres:16`, `ciso-backup-agent:16` and `ciso-audit-suite` are
  # not yet published to GHCR, so they stay on their tag — pin-images.sh pins
  # them automatically once they are.
  pilot-app:
    image: ghcr.io/cisotoolbox/ciso-pilot-suite:v1.0.0@sha256:6dad274a18624c2e7a4fae5a8af29fad7b5f71c87561d5cb946313369921e092
    container_name: ciso-pilot
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
      - /home/appuser:size=32m,mode=1777
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://pilot:${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}@pilot-db:5432/pilot
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -hex 32) — see .env.example}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      # FEAT-30 phase 2 — static DSN target for /internal/export-recovery
      - RECOVERY_DB_HOST=backup-agent
      - RECOVERY_DB_PORT=5433
      # FEAT-30 phase 2 — recovery orchestration (agent API)
      - BACKUP_AGENT_URL=http://backup-agent:9090
      - BACKUP_AGENT_TOKEN=${BACKUP_AGENT_TOKEN:?BACKUP_AGENT_TOKEN is required (recovery API), see .env.example}
      - APP_URL=${APP_URL:-https://localhost}
      # FEAT-31 — compose the suite à la carte: when set (e.g. "risk,compliance"),
      # the registry (dashboard, backups, module menu) is restricted to this
      # subset. Empty = all modules. Keep in sync with the deployed services.
      - PILOT_MODULES=${PILOT_MODULES:-}
      - RISK_URL=http://risk-app:8080
      - VENDOR_URL=http://vendor-app:8080
      - COMPLIANCE_URL=http://compliance-app:8080
      # EXTERNAL_URL values are PATH-ONLY so the browser resolves them
      # relative to the current origin — this way the port used to reach
      # Pilot (e.g. 8443 in dev) is preserved on every module link.
      - RISK_EXTERNAL_URL=/risk/
      - VENDOR_EXTERNAL_URL=/vendor/
      - COMPLIANCE_EXTERNAL_URL=/compliance/
      - ASSET_URL=http://asset-app:8080
      - ASSET_EXTERNAL_URL=/asset/
      - ACCESS_URL=http://access-app:8080
      - ACCESS_EXTERNAL_URL=/access/
      - SURFACE_URL=http://surface-app:8080
      - SURFACE_EXTERNAL_URL=/surface/
      - APPSEC_URL=http://appsec-app:8080
      - APPSEC_EXTERNAL_URL=/appsec/
      - AUDIT_URL=http://audit-app:8080
      - AUDIT_EXTERNAL_URL=/audit/
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-common}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_LABEL=${OIDC_LABEL:-SSO}
    depends_on:
      pilot-db:
        condition: service_healthy
      risk-app:
        condition: service_healthy
      vendor-app:
        condition: service_healthy
      compliance-app:
        condition: service_healthy
      asset-app:
        condition: service_healthy
      access-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/api/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ciso-net

  pilot-db:
    # ciso-postgres = same postgres:16-alpine base + pgBackRest (FEAT-30).
    image: ghcr.io/cisotoolbox/ciso-postgres:16
    # Continuous WAL archiving to the shared encrypted repository —
    # the PITR window starts at the first full backup (backup-agent).
    command: postgres -c wal_level=replica -c archive_mode=on
      -c archive_command='pgbackrest --stanza=pilot archive-push %p'
      -c archive_timeout=60
    container_name: ciso-pilot-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # CNT-03 — minimal capability set for the official postgres image:
    # entrypoint chowns PGDATA (CHOWN/FOWNER/DAC_OVERRIDE) then steps down
    # from root to the postgres user via gosu (SETUID/SETGID).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: pilot
      # PGDATA at /pg/pilot: the agent mounts the same volume at the same
      # path, satisfying pgBackRest's data-directory identity check.
      PGDATA: /pg/pilot
      PGBACKREST_PG1_PATH: /pg/pilot
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?BACKUP_CIPHER_PASS is required (pgBackRest repo encryption), see .env.example}
      PGBACKREST_LOG_LEVEL_CONSOLE: warn
    volumes:
      - pilot-pgdata:/pg/pilot
      - backups-repo:/var/lib/pgbackrest
      - pilot-pgsock:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pilot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ciso-net

