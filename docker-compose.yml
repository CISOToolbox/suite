      PGBACKREST_PG1_PATH: /pg/appsec
      POSTGRES_USER: appsec
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?BACKUP_CIPHER_PASS is required (pgBackRest repo encryption), see .env.example}
      PGBACKREST_LOG_LEVEL_CONSOLE: warn
    volumes:
      - appsec-pgdata:/pg/appsec
      - backups-repo:/var/lib/pgbackrest
      - appsec-pgsock:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appsec"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ciso-net

  # ════════════════════════════════════════════════════════════
  # WATCH — veille CVE / avis. Réactivé sur cette stack (le bloc avait été
  # retiré au profit du standalone). Même contrat que les autres modules :
  # auth déléguée à pilot, secret JWT dérivé par HKDF, chiffrement des
  # réglages via ENCRYPTION_KEY.
  watch-app:
    image: ghcr.io/cisotoolbox/ciso-watch-suite:v1.0.0@sha256:0760b5aa0757fee0a68593c7c769d245faa26695c99210a5161fa0e7e85803c7
    container_name: ciso-watch
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://watch:${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}@watch-db:5432/watch
      - JWT_SECRET=${JWT_SECRET}
      - SERVICE_TOKEN=${SERVICE_TOKEN}
      # FEAT-30 phase 2 — static DSN target for /internal/export-recovery
      - RECOVERY_DB_HOST=backup-agent
      - RECOVERY_DB_PORT=5433
      - APP_URL=${APP_URL:-https://localhost}/watch
      - AUTH_MODE=pilot
      - MODULE_COOKIE=watch_token
      - MODULE_NAME=watch
      - PILOT_URL=http://pilot-app:8080
      - APPSEC_URL=http://appsec-app:8080
      - AI_MANAGED_BY_PILOT=true
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (openssl rand -hex 32) — see .env.example}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-common}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_ISSUER=${OIDC_ISSUER}
      - OIDC_LABEL=${OIDC_LABEL:-SSO}
    depends_on:
      watch-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8080/api/health\")'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ciso-net

  watch-db:
    # ciso-postgres = same postgres:16-alpine base + pgBackRest (FEAT-30).
    image: ghcr.io/cisotoolbox/ciso-postgres:16
    # Continuous WAL archiving to the shared encrypted repository —
    # the PITR window starts at the first full backup (backup-agent).
    command: postgres -c wal_level=replica -c archive_mode=on
      -c archive_command='pgbackrest --stanza=watch archive-push %p'
      -c archive_timeout=60
    container_name: ciso-watch-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: watch
      # PGDATA at /pg/watch: the agent mounts the same volume at the same
      # path, satisfying pgBackRest's data-directory identity check.
      PGDATA: /pg/watch
      PGBACKREST_PG1_PATH: /pg/watch
      POSTGRES_USER: watch
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, see .env.example}
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?BACKUP_CIPHER_PASS is required (pgBackRest repo encryption), see .env.example}
      PGBACKREST_LOG_LEVEL_CONSOLE: warn
    volumes:
      - watch-pgdata:/pg/watch
      - backups-repo:/var/lib/pgbackrest
      - watch-pgsock:/var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watch"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ciso-net

  # ════════════════════════════════════════════════════════════
  # BACKUP-AGENT — pgBackRest scheduler (FEAT-30 étage 1)
  # ════════════════════════════════════════════════════════════
  # Shared-volume topology: read-only PGDATA + unix socket per module,
  # shared encrypted repository. Full backup weekly, diff daily,
  # verify weekly. No docker socket, no TLS pair, no extra daemon in
  # the DB containers. See backup-agent/agent.sh and the runbook.
  backup-agent:
    image: ghcr.io/cisotoolbox/ciso-backup-agent:16
    container_name: ciso-backup-agent
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PGBACKREST_REPO1_PATH: /var/lib/pgbackrest
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?BACKUP_CIPHER_PASS is required (pgBackRest repo encryption), see .env.example}
      PGBACKREST_REPO1_RETENTION_FULL: "2"
      # Recovery API (FEAT-30 phase 2): token shared with Pilot only.
      BACKUP_AGENT_TOKEN: ${BACKUP_AGENT_TOKEN:?BACKUP_AGENT_TOKEN is required (recovery API), see .env.example}
    volumes:
      - backups-repo:/var/lib/pgbackrest
      - pilot-pgdata:/pg/pilot:ro
      - pilot-pgsock:/sock/pilot
      - risk-pgdata:/pg/risk:ro
      - risk-pgsock:/sock/risk
      - vendor-pgdata:/pg/vendor:ro
      - vendor-pgsock:/sock/vendor
      - compliance-pgdata:/pg/compliance:ro
      - compliance-pgsock:/sock/compliance
      - asset-pgdata:/pg/asset:ro
      - asset-pgsock:/sock/asset
      - audit-pgdata:/pg/audit:ro
      - audit-pgsock:/sock/audit
      - access-pgdata:/pg/access:ro
      - access-pgsock:/sock/access
      - surface-pgdata:/pg/surface:ro
      - surface-pgsock:/sock/surface
      - appsec-pgdata:/pg/appsec:ro
      - appsec-pgsock:/sock/appsec
      - watch-pgdata:/pg/watch:ro
      - watch-pgsock:/sock/watch
    networks:
      - ciso-net

networks:
  ciso-net:
    driver: bridge

volumes:
  backups-repo:   # pgBackRest repository (FEAT-30) — encrypted at rest
  pilot-pgsock:
  risk-pgsock:
  vendor-pgsock:
  compliance-pgsock:
  asset-pgsock:
  audit-pgsock:
  access-pgsock:
  surface-pgsock:
  appsec-pgsock:
  watch-pgsock:
  pilot-pgdata:
  risk-pgdata:
  vendor-pgdata:
  compliance-pgdata:
  asset-pgdata:
  audit-pgdata:
  access-pgdata:
  surface-pgdata:
  appsec-pgdata:
  watch-pgdata:
  appsec-cache:   # Trivy DB + Semgrep cache — persisted across restarts
