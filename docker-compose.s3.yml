      PGBACKREST_REPO2_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET est obligatoire quand la surcharge S3 est active}
      PGBACKREST_REPO2_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT est obligatoire (ex. s3.fr-par.scw.cloud)}
      PGBACKREST_REPO2_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      PGBACKREST_REPO2_S3_KEY: ${BACKUP_S3_KEY:?BACKUP_S3_KEY est obligatoire}
      PGBACKREST_REPO2_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:?BACKUP_S3_KEY_SECRET est obligatoire}
      PGBACKREST_REPO2_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
      PGBACKREST_REPO2_CIPHER_TYPE: aes-256-cbc
      # Passphrase specific to the off-site repository, falling back to repo1's.
      # The off-site copy is exposed to a third party — the storage provider —
      # where repo1 is not: separating them lets one be handed over alone.
      PGBACKREST_REPO2_CIPHER_PASS: ${BACKUP_S3_CIPHER_PASS:-${BACKUP_CIPHER_PASS:?BACKUP_CIPHER_PASS est obligatoire}}
      PGBACKREST_REPO2_RETENTION_FULL: ${BACKUP_S3_RETENTION_FULL:-4}
      # Triggers the base backup to repo2 and the off-site restore test
      # in agent.sh.
      BACKUP_S3_ENABLED: "1"
      # Day of the off-site restore test, passed by name only.
      BACKUP_S3_TEST_DAY:

# The base stack keeps the databases and the agent off any network with
# outbound access. Off-site backup needs it — WAL archiving runs inside each
# database, base backups in the agent — so this override, and only it,
# gives them a way out.
# One per container: a shared one would let the databases reach each other.
networks:
  pilot-egress:
    driver: bridge
  risk-egress:
    driver: bridge
  vendor-egress:
    driver: bridge
  compliance-egress:
    driver: bridge
  asset-egress:
    driver: bridge
  audit-egress:
    driver: bridge
  access-egress:
    driver: bridge
  surface-egress:
    driver: bridge
  appsec-egress:
    driver: bridge
  watch-egress:
    driver: bridge
  agent-egress:
    driver: bridge

volumes:
  pilot-spool:
  risk-spool:
  vendor-spool:
  compliance-spool:
  asset-spool:
  audit-spool:
  access-spool:
  surface-spool:
  appsec-spool:
  watch-spool:
