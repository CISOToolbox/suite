# ════════════════════════════════════════════════════════════════════════
# Override — off-site backup to S3 object storage (FEAT-29)
#
# ENABLE it in the .env, never by editing this file:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.s3.yml
#
# Why a separate file rather than conditional variables:
# pgBackRest REFUSES an empty environment variable
# ("environment variable 'repo2-type' must have a value"). A
# ${BACKUP_S3_BUCKET:+s3} left empty would stop every S3-less deployment from
# starting. Here, without the override, repo2 does not exist — not an empty
# value, no line at all.
#
# What the override adds:
#   · to the 10 databases — repo2 on S3 + async WAL archiving (see below)
#   · to backup-agent — repo2, for the base backups and the restore
#   · to both — a network of its own each, to reach the object storage
#
# Base backups require an explicit call per repository (the agent takes care
# of it); WAL archiving, on the other hand, is broadcast to all of them.
# ════════════════════════════════════════════════════════════════════════
services:

  pilot-db:
    networks:
      - pilot-egress
    environment:
      PGBACKREST_REPO2_TYPE: s3
      PGBACKREST_REPO2_PATH: ${BACKUP_S3_PATH:-/pgbackrest}
      PGBACKREST_REPO2_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET est obligatoire quand la surcharge S3 est active}
      PGBACKREST_REPO2_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT est obligatoire (ex. s3.fr-par.scw.cloud)}
      PGBACKREST_REPO2_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      PGBACKREST_REPO2_S3_KEY: ${BACKUP_S3_KEY:?BACKUP_S3_KEY est obligatoire}
      PGBACKREST_REPO2_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:?BACKUP_S3_KEY_SECRET est obligatoire}
      PGBACKREST_REPO2_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
      PGBACKREST_REPO2_CIPHER_TYPE: aes-256-cbc
      # Passphrase specific to the off-site repository, falling back to repo1's.
      # The off-site copy is exposed to a third party — the storage provider —
      # where repo1 is not: separating them lets one be handed over alone.
      PGBACKREST_REPO2_CIPHER_PASS: ${BACKUP_S3_CIPHER_PASS:-${BACKUP_CIPHER_PASS:?BACKUP_CIPHER_PASS est obligatoire}}
      # NON-NEGOTIABLE as soon as a second repository exists. WAL archiving is
      # broadcast to ALL repositories; without archive-async, an S3 outage
      # keeps the other repositories from advancing by more than one segment.
      # Then archive_command fails, the WAL piles up in pg_wal, the disk
      # fills up and the database stops. In other words: the off-site backup,
      # meant to protect against a host failure, would cause one — at a
      # moment chosen by the storage provider.
      PGBACKREST_ARCHIVE_ASYNC: "y"
      PGBACKREST_SPOOL_PATH: /var/spool/pgbackrest
      PGBACKREST_ARCHIVE_PUSH_QUEUE_MAX: ${BACKUP_ARCHIVE_QUEUE_MAX:-1GiB}
      PGBACKREST_PROCESS_MAX: "2"
    volumes:
      # The spool of the asynchronous archiving. A named volume and not a tmpfs:
      # a queue that grows during an S3 outage must not eat into the
      # host's memory.
      - pilot-spool:/var/spool/pgbackrest

