# CI for this repository — the mechanical gates of the PR flow.
#
# This file is GENERATED: do not edit it here, edit the upstream source.
# Each gate matches a class of defect that was actually shipped on 2026-09-02
# despite written instructions. The adversarial review covers what the
# mechanical gates cannot see: commit claims, spec criteria, blind spots.
# The gates that run before the code reaches this repository (i18n,
# source-tree consistency) are held upstream, by the pre-commit hook and by
# the publishing step.
#
# Actions pinned by commit: checkout v4.2.2, setup-python v5.4.0.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    name: gates mécaniques
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: outillage
        run: pip install --quiet "ruff==0.6.9" pytest pytest-asyncio pydantic fastapi httpx
      - name: noms non définis (F821) — la classe « import manquant → 500 »
        run: ruff check --select F821 */src
      - name: sentinelle auth (§4.4)
        run: pytest tests/test_auth_sentinel.py -q
      - name: migrations de schéma exporté (FEAT-36)
        # Hand-written stdlib script (0 tests collected by pytest → exit 5):
        # run it the way the pre-commit hook does.
        run: python3 tests/test_schema_migrations.py
      - name: contrats de suite (prompts, add-ons, secrets, SSRF…)
        run: pytest tests/test_suite_contracts.py -q

  unit:
    name: unit ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pilot, risk, compliance, audit, vendor, asset, access, surface, appsec, watch]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.module }}/requirements.txt
      - name: dépendances du module
        # aiosqlite: the unit tests substitute SQLite for PostgreSQL — a TEST
        # dependency, deliberately absent from the image requirements.
        run: pip install --quiet pytest pytest-asyncio aiosqlite -r ${{ matrix.module }}/requirements.txt
      - name: tests unitaires
        # access/asset carry documented pre-existing failures (modules under
        # development): their suites run but do NOT block YET.
        # Remove this tolerance as soon as they pass.
        run: |
          cd ${{ matrix.module }}
          if [ ! -d tests/unit ]; then
            echo "aucun tests/unit — module sans backend testé unitairement (audit)"
            exit 0
          fi
          if [ "${{ matrix.module }}" = "access" ] || [ "${{ matrix.module }}" = "asset" ]; then
            pytest tests/unit/ -q || echo "::warning::échecs préexistants tolérés (${{ matrix.module }})"
          else
            pytest tests/unit/ -q
          fi
