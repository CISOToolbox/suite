name: Image Vulnerability Scan

# Companion to dependency-scan.yml: that one scans the dependency manifests in
# the repo, this one scans the BUILT container images for OS-level and language
# CVEs with Trivy. Referenced by dependency-scan.yml ("the weekly image scan").
#
#   Weekly (Mon 07:00 UTC) + on any change to docker-compose.yml + manual.
#   Fails on HIGH/CRITICAL with a fix available (ignore-unfixed), so a red build
#   means "an upgrade exists that you have not applied", not noise.
#
# NOTE: one of our images left on a bare tag (a brand-new module pinned with
# pin-images.sh --allow-missing) may not be published yet: its matrix leg is
# skipped with a warning and does not fail the run. Every other image, pinned by
# digest or upstream, must resolve: a leg that cannot fails instead of going
# green without a scan (the list is derived from docker-compose.yml).

on:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths: ['docker-compose.yml', '.trivyignore.yaml', '.github/workflows/image-scan.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  # ── Derive the image list from the compose file (single source of truth) ──
  discover:
    name: List images from docker-compose.yml
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: list
        run: |
          images=$(grep -vE '^[[:space:]]*#' docker-compose.yml \
            | grep -oE 'image:[[:space:]]*[^[:space:]]+' \
            | sed -E 's/image:[[:space:]]*//' | sort -u \
            | python3 -c 'import sys, json; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "Discovered: $images"

  scan:
    name: Trivy ${{ matrix.image }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # scan every image even if one is vulnerable
      matrix:
        image: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      # Probe first, with retries: a transient registry error is not
      # "unpublished". Only one of our images on a bare tag may be skipped (see
      # NOTE above); a digest-pinned or upstream image that cannot be resolved
      # fails the leg instead of leaving it green without a scan.
      - name: Check image is pullable
        id: probe
        env:
          IMAGE: ${{ matrix.image }}   # repo-derived, but never inline in run:
        run: |
          for attempt in 1 2 3; do
            if err=$(docker manifest inspect "$IMAGE" 2>&1 >/dev/null); then
              echo "ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 10))
          done
          # Registry text, printed with workflow commands disabled.
          token="probe-$RANDOM$RANDOM"
          echo "::stop-commands::$token"
          echo "$err"
          echo "::$token::"
          case "$IMAGE" in
            *@sha256:*) ;;
            ghcr.io/cisotoolbox/*)
              echo "::warning::$IMAGE is not in the registry yet — skipping"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          echo "::error::$IMAGE could not be resolved — not scanned"
          exit 1

      # .trivyignore.yaml: findings accepted for a bounded time, each scoped to
      # one upstream binary with no fixed release yet (expired_at forces review).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: steps.probe.outputs.ok == 'true'

      - name: Trivy scan (HIGH/CRITICAL, fixable)
        if: steps.probe.outputs.ok == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'          # fail the leg on a fixable HIGH+
          format: table
          trivyignores: .trivyignore.yaml
