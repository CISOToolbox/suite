events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Do not advertise the nginx version in Server headers / error pages (NGX-03).
    server_tokens off;

    proxy_connect_timeout 10s;
    # 180s read: the AI proxy calls (POST /api/ai/complete and the Pilot
    # grouping/plan assistants) legitimately wait on the LLM well past 60s —
    # the backends cap at 120s, nginx must outlive them.
    proxy_read_timeout    180s;
    proxy_send_timeout    60s;
    client_max_body_size  10m;

    # Response-header buffer (AUTH-01). Pilot's login redirect and its
    # /auth/me response carry one Set-Cookie per module — one SSO token per
    # module, each signed with that module's own derived key — i.e. ~4.2 KB
    # of headers. The default proxy_buffer_size is one page (4k here), and
    # nginx answers 502 "upstream sent too big header" past that. 16k leaves
    # room for the tokens plus everything else.
    proxy_buffer_size       16k;
    proxy_buffers        8  16k;
    proxy_busy_buffers_size 32k;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Docker's embedded DNS. `valid=10s` caps how long nginx caches a
    # resolution — any module container restart gets picked up in ≤10s
    # on the next request. `ipv6=off` silences AAAA lookups.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # NOTE: no `upstream` blocks here. Using variable-based `proxy_pass`
    # (see each `location`) forces nginx to re-resolve the upstream hostname
    # at request time instead of caching it once at worker startup — this
    # is the fix for the "proxy mixes links between apps" bug that happens
    # after a module container is recreated and gets a new Docker-network
    # IP while nginx still holds the old one.

    # ── Rate limiting (NGX-01) ────────────────────────────────────
    # Keyed maps: the zone key is empty (= exempt) for every URI that is
    # not in scope, so normal navigation and SPA bootstrap calls
    # (/auth/me, /auth/providers, /auth/role, static assets) are NEVER
    # throttled. Only the brute-forceable and costly endpoints count.
    #
    # 1) Login / OAuth-callback endpoints — 10 req/min per client IP.
    #    Covers /auth/login, /auth/login/token, /auth/login/<idp> and
    #    /auth/callback/<idp> at the root (pilot) and under each module.
    map $request_uri $rl_auth_key {
        default "";
        ~^/([a-z]+/)?auth/(login|callback) $binary_remote_addr;
    }
    limit_req_zone $rl_auth_key zone=authlim:1m rate=10r/m;

    # 2) Costly scan/probe launches (POST only — GET listings stay free):
    #    surface/appsec scan jobs, vendor URL verification & bulk probing
    #    (SSRF-01 abuse surface). 30 req/min per client IP.
    map "$request_method:$request_uri" $rl_scan_key {
        default "";
        ~^POST:/[a-z]+/api/scans $binary_remote_addr;
        ~^POST:/vendor/api/(verify-url|probe-vendor-urls) $binary_remote_addr;
    }
    limit_req_zone $rl_scan_key zone=scanlim:1m rate=30r/m;

    # Return 429 (not the default 503) when a limit trips.
    limit_req_status 429;

    # ── Cache control ─────────────────────────────────────────────
    # Force the browser to revalidate HTML/JS/CSS on every load so a code
    # change is picked up immediately. Static assets still benefit from
    # ETag/If-None-Match revalidation (304 when unchanged).
    map $sent_http_content_type $cache_policy {
        default                       "no-cache, must-revalidate";
        ~image/                       "public, max-age=3600";
        ~font/                        "public, max-age=86400";
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Prevent Nginx from stripping the port in redirects
        absolute_redirect off;

        # Rate limiting (see zones in the http block). Both zones use an
        # empty key outside their scope, so applying them server-wide only
        # affects login/callback and scan-launch requests.
        limit_req zone=authlim burst=5 nodelay;
        limit_req zone=scanlim burst=10 nodelay;

        # Always send Cache-Control so browsers don't keep stale assets forever.
        add_header Cache-Control $cache_policy always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;

        # Security headers at the edge (belt + braces with module-level headers).
        # HSTS: 1 year, includeSubDomains. Comment out if you're not sure all subdomains
        # are HTTPS-ready, or on first rollout with an HTTP origin still in use.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;

        # ── Module routes ─────────────────────────────────────────
        # Pattern per module:
        #   - exact /<name>  -> 302 redirect (NOT 301: 301 is cached forever
        #     by browsers, which is exactly the bug we hit)
        #   - /<name>/...    -> proxy to upstream, with:
        #       * proxy_redirect   rewrites upstream Location: /foo into
        #         Location: /<name>/foo so RedirectResponse(url="/") from
        #         FastAPI doesn't send the user back to Pilot (the catch-all).
        #       * proxy_cookie_path confines module cookies (risk_token,
        #         surface_token, …) to their sub-path. Without this, cookies
        #         set with Path=/ by the upstream leak across modules and
        #         a login on Risk would be visible to Surface.
        # `^~` makes nginx pick this prefix without checking regex locations.

        # Risk
        location = /risk {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
                                    return 302 /risk/;
        }
        location ^~ /risk/ {
            set $upstream_risk http://risk-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/risk/(.*)$ /$1 break;
            proxy_pass $upstream_risk;
            proxy_redirect ~^/risk/ /risk/;
            proxy_redirect ~^/       /risk/;
            proxy_cookie_path / /risk/;
        }

        # Vendor
        location = /vendor {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
                        return 302 /vendor/;
        }
        location ^~ /vendor/ {
            set $upstream_vendor http://vendor-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/vendor/(.*)$ /$1 break;
            proxy_pass $upstream_vendor;
            proxy_redirect ~^/vendor/ /vendor/;
            proxy_redirect ~^/         /vendor/;
            proxy_cookie_path / /vendor/;
        }

        # Compliance
        location = /compliance {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
                        return 302 /compliance/;
        }
        location ^~ /compliance/ {
            set $upstream_compliance http://compliance-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/compliance/(.*)$ /$1 break;
            proxy_pass $upstream_compliance;
            proxy_redirect ~^/compliance/ /compliance/;
            proxy_redirect ~^/             /compliance/;
            proxy_cookie_path / /compliance/;
        }

        # Asset
        location = /asset {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
                        return 302 /asset/;
        }
        location ^~ /asset/ {
            set $upstream_asset http://asset-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/asset/(.*)$ /$1 break;
            proxy_pass $upstream_asset;
            proxy_redirect ~^/asset/ /asset/;
            proxy_redirect ~^/        /asset/;
            proxy_cookie_path / /asset/;
        }

        # Audit
        location = /audit {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
                        return 302 /audit/;
        }
        location ^~ /audit/ {
            set $upstream_audit http://audit-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/audit/(.*)$ /$1 break;
            proxy_pass $upstream_audit;
            proxy_redirect ~^/audit/ /audit/;
            proxy_redirect ~^/        /audit/;
            proxy_cookie_path / /audit/;
        }

        # Access
        location = /access {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
                        return 302 /access/;
        }
        location ^~ /access/ {
            set $upstream_access http://access-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/access/(.*)$ /$1 break;
            proxy_pass $upstream_access;
            proxy_redirect ~^/access/ /access/;
            proxy_redirect ~^/         /access/;
            proxy_cookie_path / /access/;
        }

        # Surface
        location = /surface {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
                        return 302 /surface/;
        }
        location ^~ /surface/ {
            set $upstream_surface http://surface-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/surface/(.*)$ /$1 break;
            proxy_pass $upstream_surface;
            proxy_redirect ~^/surface/ /surface/;
            proxy_redirect ~^/          /surface/;
            proxy_cookie_path / /surface/;
        }

        # AppSec
        location = /appsec {
            add_header Cache-Control "no-store" always;
            # nginx does NOT merge add_header across levels: a location that
            # declares even one drops every header from the server block. The
            # Cache-Control above therefore silently cost these redirects their
            # HSTS / XFO / nosniff / Referrer-Policy / Permissions-Policy.
            # Repeated here because only nginx.conf is mounted — there is no
            # snippet file to include.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
            return 302 /appsec/;
        }
        location ^~ /appsec/ {
            set $upstream_appsec http://appsec-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            rewrite ^/appsec/(.*)$ /$1 break;
            proxy_pass $upstream_appsec;
            proxy_redirect ~^/appsec/ /appsec/;
            proxy_redirect ~^/         /appsec/;
            proxy_cookie_path / /appsec/;
        }

        # Watch
        location = /watch {
            add_header Cache-Control "no-store" always;
            # nginx ne fusionne pas add_header entre niveaux : une location qui en
            # declare un seul perd tous ceux du bloc server. On les repete donc.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
            return 302 /watch/;
        }
        location ^~ /watch/ {
            set $upstream_watch http://watch-app:8080;
            # Les routes internes inter-modules ne sont pas exposees en bordure.
            location ~ /internal(/|$) { return 404; }
            rewrite ^/watch/(.*)$ /$1 break;
            proxy_pass $upstream_watch;
            proxy_redirect ~^/watch/ /watch/;
            proxy_redirect ~^/       /watch/;
            proxy_cookie_path / /watch/;
        }

        # Pilot (default catch-all)
        location / {
            set $upstream_pilot http://pilot-app:8080;
            # Internal cross-module routes are not exposed at the edge (defense in depth).
            # `(/|$)` also catches routes with a trailing /internal segment and no
            # slash after it, e.g. /api/audit-log/internal (NGX-02).
            location ~ /internal(/|$) { return 404; }
            proxy_pass $upstream_pilot;
        }
    }

    server {
        listen 80;
        server_name _;
        absolute_redirect off;
        return 301 https://$host:$server_port$request_uri;
    }
}
