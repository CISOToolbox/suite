<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access - CISO Toolbox</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/cisotoolbox.css">
<link rel="stylesheet" href="css/access.css">
</head>
<body>

<div class="ct-app">
<header class="ct-appbar">
    <button class="btn-hamburger" data-click="_toggleSidebarMobile">&#9776;</button>
    <span class="ct-modulepicker" role="img" aria-label="Access"><span data-i18n="module.access">Access</span></span>
    <span class="ct-appbar-sep"></span>
    <nav class="ct-appbar-context" aria-label="Contexte"><span class="ct-muted" id="header-subtitle"></span></nav>
<!-- File menu disabled: local functions (open/save/imports) not wired up yet in suite mode — re-enable by uncommenting. -->
<!--     <div class="toolbar-menu">
        <button class="ct-btn" data-size="sm" data-click="toggleMenu"><span data-i18n="menu_file">Fichier</span></button>
        <div class="toolbar-dropdown" id="io-menu">
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["newAnalysis"]' data-i18n="menu_new">Nouveau projet</div>
            <div class="toolbar-dropdown-sep"></div>
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["openFile"]' data-i18n="menu_open">Ouvrir</div>
            <div class="toolbar-dropdown-item" data-click="_menuAction" data-args='["saveJSON"]' data-i18n="menu_save_as">Enregistrer sous</div>
        </div>
    </div> -->
    <span class="ct-spacer"></span>
    <span class="ct-appbar-saved" id="status-msg"></span>
    <div class="ct-appbar-actions">
        <button class="ct-iconaction" data-click="ct_toggleLang" data-icon="globe" aria-label="Langue" title="Langue FR / EN"></button>
        <button class="ct-iconaction" data-click="ct_toggleTheme" data-icon="moon" aria-label="Thème" title="Thème clair / sombre"></button>
        <span class="ct-toolbar-right" id="toolbar-right"></span>
    </div>
</header>

<div class="ct-body">

<nav class="ct-rail" id="sidebar" aria-label="Navigation du module">
  <div class="ct-rail-scroll">
    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span>ACCESS</span>
      </button>
      <button class="ct-rail-item" aria-current="page" data-click="selectPanel" data-args='["dashboard"]'><span class="ct-rail-item-label" data-i18n="nav.dashboard">Tableau de bord</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["users"]'><span class="ct-rail-item-label" data-i18n="nav.users">Utilisateurs</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["apps"]'><span class="ct-rail-item-label" data-i18n="nav.apps">Applications</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["service_accounts"]'><span class="ct-rail-item-label" data-i18n="nav.service_accounts">Comptes de service</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["reviews"]'><span class="ct-rail-item-label" data-i18n="nav.reviews">Revues</span></button>
      <button class="ct-rail-item" data-click="selectPanel" data-args='["measures"]'><span class="ct-rail-item-label" data-i18n="nav.measures">Mesures</span></button>
    </div>

    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span>Administration</span>
      </button>
      <button class="ct-rail-item ct-admin-only" data-click="selectPanel" data-args='["plugins"]'><span class="ct-rail-item-label" data-i18n="nav.plugins">Connecteurs</span></button>
    </div>

    <div class="ct-rail-section">
      <button class="ct-rail-group" aria-expanded="true" data-click="ct_toggleRailGroup" data-pass-el>
        <span class="ct-icon-btn-slot" data-icon="chevron-right"></span><span data-i18n="nav.aide">AIDE</span>
      </button>
      <button class="ct-rail-item" data-click="toggleHelp" data-args='["methodo"]'><span class="ct-rail-item-label" data-i18n="nav.methodo">Méthodologie</span></button>
      <button class="ct-rail-item" data-click="toggleHelp" data-args='["usage"]'><span class="ct-rail-item-label" data-i18n="nav.usage">Utilisation</span></button>
    </div>
  </div>

  <div class="ct-rail-foot">
    <a href="https://www.cisotoolbox.org" target="_blank" rel="noopener noreferrer" class="sidebar-brand">cisotoolbox.org</a>
  </div>
</nav>

<main class="ct-content" id="content"></main>
</div><!-- ct-body -->
</div><!-- ct-app -->

<input type="file" id="file-input" accept=".json,.enc" class="ct-hidden" data-change="loadJSON" data-pass-event>
<input type="file" id="csv-import-input" accept=".csv,.txt" class="ct-hidden">
<input type="file" id="connector-file-input" accept=".xlsx" class="ct-hidden">

<div class="ct-pwd-overlay" id="confirm-overlay">
<div class="ct-pwd-panel">
    <div class="ct-pwd-title" id="confirm-title"></div>
    <div id="confirm-body" class="ct-text-data ct-mb-3"></div>
    <div class="ct-flex ct-gap-2 ct-justify-end">
        <button class="ct-btn" id="confirm-non" data-i18n="btn_discard">Non</button>
        <button class="ct-btn" data-variant="primary" id="confirm-oui" data-i18n="btn_confirm">Oui</button>
    </div>
</div>
</div>

<div class="ct-pwd-overlay" id="pwd-overlay">
<div class="ct-pwd-panel">
    <div class="ct-pwd-title" id="pwd-title">Mot de passe</div>
    <input type="password" class="ct-pwd-input" id="pwd-input" placeholder="Mot de passe" autocomplete="off">
    <input type="password" class="ct-pwd-input hidden" id="pwd-input2" placeholder="Confirmer le mot de passe" autocomplete="off">
    <div class="ct-pwd-error" id="pwd-error"></div>
    <div class="ct-flex ct-gap-2 ct-justify-end ct-mt-2">
        <button class="ct-btn" id="pwd-cancel">Annuler</button>
        <button class="ct-btn" data-variant="primary" id="pwd-ok">OK</button>
    </div>
</div>
</div>

<!-- Help overlay (Méthodologie + Guide d'utilisation) -->
<div class="help-overlay" id="help-overlay" data-click-self="toggleHelp">
<div class="help-panel">
    <button class="close-help" data-click="toggleHelp">&times;</button>
    <div class="help-tabs">
        <div class="help-tab active" id="help-tab-methodo" data-click="switchHelpTab" data-args='["methodo"]' data-i18n="help.tab_methodo">Méthodologie Access</div>
        <div class="help-tab" id="help-tab-usage" data-click="switchHelpTab" data-args='["usage"]' data-i18n="help.tab_usage">Guide d'utilisation</div>
    </div>
    <div class="help-content" id="help-content-methodo" data-i18n-html="help.methodo_html"></div>
    <div class="help-content ct-hidden" id="help-content-usage" data-i18n-html="help.usage_html"></div>
</div>
</div>

<script src="js/ct_schema.js"></script>
<script src="js/cisotoolbox.js"></script>
<script src="js/ct_modules.js"></script>
<script src="js/cisotoolbox_backend.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n_core_en.js"></script>
<script src="js/i18n_core_fr.js"></script>
<script src="js/Access_i18n_fr.js"></script>
<script src="js/Access_i18n_en.js"></script>
<script src="js/ct_refselect.js"></script>
<script src="js/ct_modal.js"></script>
<script src="js/ct_userpicker.js"></script>
<script src="js/ct_measure_modal.js"></script>
<script src="js/ct_table.js"></script>
<script src="js/ct_bulkbar.js"></script>
<script src="js/access_api.js?v=2"></script>
<script src="js/directory_picker.js"></script>
<script src="js/Access_app.js"></script>
<script src="js/ai_common.js"></script>
<script src="js/ct_settings.js"></script>
<script src="js/ai_backend.js"></script>

</body>
</html>
