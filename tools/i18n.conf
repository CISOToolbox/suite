# i18n languages bundled at packaging time (read by i18n-apply.sh / build-client-image).
#   BASE  : base language — statically loaded, fallback of t(). Product default.
#   LANGS : languages kept (the base is always included). The others are
#           stripped from the build (scripts + files), so never bundled.
#
# Suite in dev: keep "en fr" (both available, English base).
# English-speaking client: LANGS="en"  → no French file bundled.
BASE=en
LANGS="en fr"
