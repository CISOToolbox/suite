  # Opengrep 1.30.0 (appsec, /opt/opengrep/opengrep.cdx.json): urllib3 2.7.0 is
  # compiled into its release binary — fixed upstream (2.8.0), not yet in an
  # Opengrep release. Opengrep runs offline here (local rules, no version
  # check), which is where these urllib3 flaws would be reached. Re-check at the
  # next Opengrep release.
  - id: CVE-2026-97687
    purls:
      - "pkg:pypi/urllib3@2.7.0"
