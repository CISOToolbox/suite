# ════════════════════════════════════════════════════════════════════════
# Override — certificate authority of the object storage (FEAT-29)
#
# ENABLE THIS ONLY for an internal object storage serving a private
# certificate (an in-house MinIO, for example):
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.s3.yml:docker-compose.s3-ca.yml
#   BACKUP_S3_CA_FILE=/opt/ciso-toolbox/certs/minio-ca.crt
#
# BACKUP_S3_CA_FILE is the path on the HOST; the override mounts it into each
# container by itself. Nothing else to do.
#
# A separate file, and not a variable with an empty default in
# docker-compose.s3.yml: pgBackRest REFUSES an empty environment variable.
# Public providers (AWS, Scaleway, Wasabi…) present recognised certificates
# and do not need this override.
# ════════════════════════════════════════════════════════════════════════
services:

  pilot-db:
    environment:
      # FIXED path inside the container: the file is mounted just below.
      # This override used to name a path without providing it, and pgBackRest
      # answered "unable to set user-defined CA certificate location: no
      # details available" — a message that points at nothing.
      PGBACKREST_REPO2_STORAGE_CA_FILE: /etc/pgbackrest/s3-ca.crt
    volumes:
      # The path on the HOST to your object storage's certificate.
      - ${BACKUP_S3_CA_FILE:?BACKUP_S3_CA_FILE doit désigner, sur l'hôte, le certificat de l'autorité de votre stockage objet}:/etc/pgbackrest/s3-ca.crt:ro

